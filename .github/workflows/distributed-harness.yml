name: Distributed harness verification
on:
  push:
    branches: [feat/distributed-harness-20260911]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked Python environment
        run: python -m pip install -r requirements-distributed.lock
      - name: Python regression tests
        run: |
          mkdir -p test-results
          python -m pytest -m 'not real_gateway' --junitxml=test-results/python-baseline.xml -q
      - name: Node regression tests
        run: npm test
      - name: Package source and evidence
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/commit.txt
          git archive --format=tar HEAD > test-results/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-harness-evidence
          path: test-results/
          retention-days: 14
