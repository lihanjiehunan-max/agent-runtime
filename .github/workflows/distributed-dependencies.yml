name: Resolve distributed dependencies
on:
  push:
    branches: [feat/distributed-harness-20260911]
    paths: ['.github/workflows/distributed-dependencies.yml']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install uv
          uv sync --frozen
          mkdir -p dependencies/wheels
          uv pip freeze > dependencies/baseline.txt
          uv pip install -c dependencies/baseline.txt 'SQLAlchemy==2.0.50' 'psycopg[binary]>=3.2,<4' 'redis>=5,<7' 'boto3>=1.35,<2'
          uv pip freeze > dependencies/requirements-distributed.lock
          python -m pip download --only-binary=:all: --python-version 3.13 -r dependencies/requirements-distributed.lock -d dependencies/wheels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-dependencies
          path: dependencies/
          retention-days: 7
