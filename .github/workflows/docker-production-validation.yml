name: Docker distributed runtime verification
on:
  push:
    branches: [feat/distributed-harness-20260911]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN_DOCKER_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked verification environment
        run: |
          mkdir -p validation-results
          python -m pip install -r requirements-distributed.lock
          git rev-parse HEAD > validation-results/tested-commit.txt
          python -m pip freeze > validation-results/python-environment.txt
      - name: Build React console
        working-directory: apps/runtime_console
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Regressions
        run: |
          set -o pipefail
          python -m pytest tests -m 'not real_gateway' --junitxml=validation-results/python.xml -q | tee validation-results/python.log
          npm test | tee validation-results/node.log
      - name: Validate and build Docker image
        run: |
          set -o pipefail
          docker compose -p dh-validation -f deploy/compose.validation.yml config --quiet
          docker compose -p dh-validation -f deploy/compose.validation.yml build api-a 2>&1 | tee validation-results/build.log
      - name: Start independent nodes and real backing services
        run: |
          set -o pipefail
          docker compose -p dh-validation -f deploy/compose.validation.yml up -d --no-build --wait --wait-timeout 180 2>&1 | tee validation-results/startup.log
      - name: Distributed load and fault injection acceptance
        run: |
          set -o pipefail
          python scripts/validate_docker_cluster.py 2>&1 | tee validation-results/acceptance.log
      - name: Bounded synthetic load
        run: |
          set -o pipefail
          python scripts/validate_runtime_soak.py --seconds 60 --concurrency 8 --max-tasks 500 | tee validation-results/bounded-load.log
      - name: Build release images without fixture services
        run: |
          docker build -f deploy/Dockerfile.runtime --target runtime -t agent-runtime:delivery .
          docker run --rm --entrypoint python agent-runtime:delivery -c "from pathlib import Path; assert not Path('/app/tests').exists(); from apps.distributed_runtime.api import create_app"
          docker build -f deploy/Dockerfile.runtime --target console -t agent-runtime-console:delivery .
      - name: Archive and stop baseline before release multiport test
        run: |
          docker compose -p dh-validation -f deploy/compose.validation.yml ps -a > validation-results/containers.txt
          docker compose -p dh-validation -f deploy/compose.validation.yml logs --no-color > validation-results/container-logs.txt
          docker compose -p dh-validation -f deploy/compose.validation.yml down -v --remove-orphans
      - name: Prepare browser verification
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Release topology multiport and attached browser acceptance
        run: |
          set -o pipefail
          python scripts/validate_release_compose.py | tee validation-results/release-acceptance.log
      - name: Browser acceptance
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          RUN_RECOVERY_NEGATIVE_CONTROL=1 python scripts/validate_recovery_controls.py
          git diff --exit-code -- apps/distributed_runtime/harness.py apps/runtime_console/src/main.tsx
          python scripts/validate_console_browser.py
      - name: Capture evidence and source
        if: always()
        run: |
          mkdir -p validation-results
          test -s validation-results/containers.txt || docker compose -p dh-validation -f deploy/compose.validation.yml ps -a > validation-results/containers.txt 2>&1 || true
          test -s validation-results/container-logs.txt || docker compose -p dh-validation -f deploy/compose.validation.yml logs --no-color > validation-results/container-logs.txt 2>&1 || true
          docker stats --no-stream > validation-results/resources.txt 2>&1 || true
          docker images --digests --no-trunc > validation-results/images.txt 2>&1 || true
          cp apps/runtime_console/package-lock.json validation-results/console-package-lock.json
          tar -czf validation-results/console-dist.tar.gz -C apps/runtime_console dist
          git archive --format=zip --output=validation-results/source.zip HEAD
          sha256sum validation-results/source.zip > validation-results/source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-production-validation
          path: validation-results/
          retention-days: 14
      - name: Remove isolated test environment
        if: always()
        run: docker compose -p dh-validation -f deploy/compose.validation.yml down -v --remove-orphans || true
