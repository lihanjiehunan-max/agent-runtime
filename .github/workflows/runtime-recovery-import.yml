name: Verify and import final runtime repairs
on:
  push:
    branches: [feat/distributed-harness-20260911]
    paths: ['_delivery/**', '.github/workflows/runtime-recovery-import.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/distributed-harness-20260911
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source transport and apply exact tested patch
        run: |
          mkdir -p recovery-import-evidence
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          parts=sorted(Path('_delivery').glob('*.patch'))
          assert len(parts)==6, 'Incomplete source transport'
          patch=b''.join(p.read_bytes() for p in parts)
          actual=hashlib.sha256(patch).hexdigest()
          expected='33ad99de84f45c27ee259fbf3517915b0b28e37214cb0988b4458dfe4ff0ec3e'
          assert actual==expected, (actual,expected)
          Path('recovery-import-evidence/repair.patch').write_bytes(patch)
          Path('recovery-import-evidence/patch.sha256').write_text(actual+'\n')
          subprocess.run(['git','apply','--check','recovery-import-evidence/repair.patch'],check=True)
          subprocess.run(['git','apply','--index','recovery-import-evidence/repair.patch'],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert not any(p.startswith('.github/') for p in changed)
          PY
      - name: Python and Node regressions
        run: |
          set -o pipefail
          python -m pip install -r requirements-distributed.lock
          python -m pytest tests -m 'not real_gateway' --junitxml=recovery-import-evidence/python.xml -q | tee recovery-import-evidence/python.log
          npm test | tee recovery-import-evidence/node.log
      - name: Compile repaired console with locked dependencies
        working-directory: apps/runtime_console
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Commit readable verified source
        run: |
          git rm _delivery/*.patch
          git config user.name 'Runtime Delivery'
          git config user.email 'runtime-delivery@users.noreply.github.com'
          git commit -m 'fix: preserve ambiguous submissions and bound distributed child results'
          git push origin HEAD:feat/distributed-harness-20260911
          git rev-parse HEAD > recovery-import-evidence/source-commit.txt
      - name: Save evidence
        if: always()
        run: |
          mkdir -p recovery-import-evidence
          git status --short > recovery-import-evidence/status.txt
          git rev-parse HEAD > recovery-import-evidence/head.txt
          git archive --format=zip --output=recovery-import-evidence/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-recovery-import
          path: recovery-import-evidence/
          retention-days: 14
