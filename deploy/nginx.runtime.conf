worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    upstream runtime_api { server api-a:8000; server api-b:8000; keepalive 16; }
    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 512k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header Cache-Control no-store always;
        root /usr/share/nginx/html;
        location / { try_files $uri $uri/ /index.html; }
        location /assets/ { try_files $uri =404; }
        location /api/ {
            proxy_pass http://runtime_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            # Do not replay non-idempotent POSTs at the reverse proxy.
            proxy_next_upstream off;
        }
        location = /healthz { proxy_pass http://runtime_api; }
        location = /metrics { proxy_pass http://runtime_api; }
    }
}
