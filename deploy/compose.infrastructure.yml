# Optional single-host integration infrastructure, not a database HA topology.
x-local-dependencies: &local-dependencies
  postgres: {condition: service_healthy}
  redis: {condition: service_healthy}
  minio: {condition: service_healthy}
services:
  api-a: {depends_on: *local-dependencies}
  api-b: {depends_on: *local-dependencies}
  worker-a: {depends_on: *local-dependencies}
  worker-b: {depends_on: *local-dependencies}
  worker-c: {depends_on: *local-dependencies}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: runtime
      POSTGRES_DB: runtime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime -d runtime"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment: {REDISCLI_AUTH: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"}
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}
    volumes: ["s3data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
  s3data:
